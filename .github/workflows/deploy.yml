name: Deploy Landing Page

on:
  push:
    branches: [ master ] # تم التعديل هنا لـ master

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24  # حدثنا النسخة هنا لتجنب التحذير
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        # ضفنا السطر ده عشان يتجاوز أخطاء الـ CSS البسيطة ويكمل الـ Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4